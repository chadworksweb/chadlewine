<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Cassette format template">
  <defs>
    <clipPath id="cover-clip-cassette">
      <rect x="48" y="96" width="304" height="104" />
    </clipPath>
  </defs>

  <!-- Cassette shell body -->
  <rect x="32" y="88" width="336" height="224" rx="10" ry="10" fill="#0d0d1a" stroke="#00d4ff" stroke-width="1.5" />

  <!-- Upper half: j-card label area with cover art -->
  <rect x="48" y="96" width="304" height="104" fill="#12121a" stroke="#00d4ff" stroke-width="1" />
  <image data-cover="true" href="" x="48" y="96" width="304" height="104"
         clip-path="url(#cover-clip-cassette)" preserveAspectRatio="xMidYMid slice" />
  <rect x="48" y="96" width="304" height="104" fill="none" stroke="#00d4ff" stroke-width="2" />

  <!-- Divider line between label and mechanism -->
  <line x1="48" y1="208" x2="352" y2="208" stroke="#3a3a5c" stroke-width="1" />

  <!-- Magnetic tape window: horizontal slot in the middle of the mechanism -->
  <rect x="80" y="220" width="240" height="32" fill="#0a0a14" stroke="#00d4ff" stroke-width="1" />
  <!-- Tape strip across the window -->
  <rect x="80" y="232" width="240" height="8" fill="#1a1a2a" />

  <!-- Left reel hub -->
  <g transform="translate(120 276)">
    <circle r="24" fill="#0a0a14" stroke="#00d4ff" stroke-width="1" />
    <circle r="14" fill="#ff9500" />
    <circle r="14" fill="none" stroke="#0d0d1a" stroke-width="1" />
    <!-- Hub spokes -->
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#0d0d1a" stroke-width="1.5" />
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#0d0d1a" stroke-width="1.5" />
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#0d0d1a" stroke-width="1.5" />
    <line x1="-7" y1="7" x2="7" y2="-7" stroke="#0d0d1a" stroke-width="1.5" />
  </g>

  <!-- Right reel hub -->
  <g transform="translate(280 276)">
    <circle r="24" fill="#0a0a14" stroke="#00d4ff" stroke-width="1" />
    <circle r="14" fill="#ff9500" />
    <circle r="14" fill="none" stroke="#0d0d1a" stroke-width="1" />
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#0d0d1a" stroke-width="1.5" />
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#0d0d1a" stroke-width="1.5" />
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#0d0d1a" stroke-width="1.5" />
    <line x1="-7" y1="7" x2="7" y2="-7" stroke="#0d0d1a" stroke-width="1.5" />
  </g>

  <!-- Side A indicator: small mono text on left -->
  <text x="48" y="304" fill="#00d4ff" font-family="'Share Tech Mono', 'Courier New', monospace" font-size="10" letter-spacing="2" opacity="0.7">SIDE A</text>

  <!-- Bottom shell screws (small dots) -->
  <circle cx="44" cy="304" r="2" fill="#3a3a5c" />
  <circle cx="356" cy="304" r="2" fill="#3a3a5c" />

  <!-- Gold corner marks on label -->
  <path d="M 48 112 L 48 96 L 64 96" stroke="#ff9500" stroke-width="2" fill="none" stroke-linecap="square" />
  <path d="M 352 184 L 352 200 L 336 200" stroke="#ff9500" stroke-width="2" fill="none" stroke-linecap="square" />

  <!-- Bottom spec line -->
  <text x="200" y="344" fill="#00d4ff" font-family="'Share Tech Mono', 'Courier New', monospace" font-size="11" text-anchor="middle" letter-spacing="3" opacity="0.85">ANALOG TAPE</text>
</svg>
