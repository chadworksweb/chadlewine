# chadlewine STAGING -- staging.chadlewine.com -> cl-staging container (le-proxy
# alias `cl-staging`, port 3005). Lives in the central le-nginx at
# /root/proxy/nginx/conf.d/chadlewine-staging.conf. Modeled on lyrictransformer.conf.
# Differs: 200m body cap (admin media uploads up to 200MB) and a single host
# (no www on staging). Staging shares the LIVE Supabase but runs Stripe TEST +
# a test/catch-all email sender + NO crons -- side effects are guarded at the app
# edges, not here.

server {
    listen 80;
    listen [::]:80;
    server_name staging.chadlewine.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://staging.chadlewine.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.chadlewine.com;

    ssl_certificate /etc/letsencrypt/live/staging.chadlewine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.chadlewine.com/privkey.pem;
    include /etc/nginx/ssl-common.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Keep staging out of search indexes (shared DB, real content).
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Admin media uploads go up to 200MB (next.config proxyClientMaxBodySize).
    # NOTE: Cloudflare FREE caps request bodies at 100MB (see DEPLOY.md).
    client_max_body_size 200m;

    # Behind Cloudflare: rewrite $remote_addr to the true visitor IP.
    include /etc/nginx/conf.d/cloudflare-realip.inc;

    location / {
        proxy_pass http://cl-staging:3005;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Real client via real_ip (CF-Connecting-IP); sole XFF entry, unspoofable.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Large uploads + occasional long admin/API operations.
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering on;
    }
}
