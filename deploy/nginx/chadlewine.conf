# chadlewine PRODUCTION -- chadlewine.com + www -> cl-prod container (le-proxy
# alias `cl-prod`, port 3006). Lives in the central le-nginx at
# /root/proxy/nginx/conf.d/chadlewine.conf. Modeled on lyrictransformer.conf.
# Differs: 200m body cap (admin media uploads up to 200MB). Prod runs Stripe LIVE,
# the real email sender, and the 6 cron jobs (system crontab, prod ONLY).
#
# One SAN cert covers chadlewine.com + www.chadlewine.com, so both 443 blocks
# reference /etc/letsencrypt/live/chadlewine.com/.

server {
    listen 80;
    listen [::]:80;
    server_name chadlewine.com www.chadlewine.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://chadlewine.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chadlewine.com;

    ssl_certificate /etc/letsencrypt/live/chadlewine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chadlewine.com/privkey.pem;
    include /etc/nginx/ssl-common.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Admin media uploads go up to 200MB (next.config proxyClientMaxBodySize).
    client_max_body_size 200m;

    location / {
        proxy_pass http://cl-prod:3006;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering on;
    }
}

# www -> apex (uses the same SAN cert).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.chadlewine.com;
    ssl_certificate /etc/letsencrypt/live/chadlewine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chadlewine.com/privkey.pem;
    include /etc/nginx/ssl-common.conf;
    return 301 https://chadlewine.com$request_uri;
}
